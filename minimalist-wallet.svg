<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#FAFAFA"/>
  <g stroke="#999999" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Card inside wallet -->
    <rect x="150" y="130" width="100" height="50" rx="8" stroke-width="6"/>
    <rect x="165" y="145" width="18" height="14" rx="3" fill="#999999" stroke="none"/>
    <!-- Wallet body -->
    <rect x="130" y="160" width="140" height="110" rx="14" fill="#EAEAEA"/>
    <!-- Card slot curve -->
    <path d="M 130 195 C 170 208 230 208 270 195" stroke-width="6"/>
    <!-- Stitching line -->
    <rect x="136" y="166" width="128" height="98" rx="10" stroke-width="2" stroke-dasharray="6 5"/>
  </g>
</svg>